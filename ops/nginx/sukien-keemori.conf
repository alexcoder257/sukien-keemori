# Nginx trên host cho stack sukien-keemori — chạy CẠNH config của keemori.com
# trên cùng VPS, không sửa file của keemori.
#
#   sudo cp ops/nginx/sukien-keemori.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/sukien-keemori.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d sukien.keemori.com -d api-sukien.keemori.com -d cms-sukien.keemori.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ba tên miền phải khớp PUBLIC_WEB_URL / PUBLIC_API_URL / PUBLIC_CMS_URL trong
# /opt/sukien-keemori/.env. Tên phẳng `api-sukien` (không phải `api.sukien`)
# để một chứng chỉ wildcard `*.keemori.com` phủ được nếu sau này chuyển sang.
#
# Cổng upstream khớp HOST_PORT_* trong .env (mặc định 3110/3111/3112 — 3100 đã thuộc keemori-tools).
# certbot sẽ tự thêm khối `listen 443 ssl` và redirect 80 → 443.

# Trang khách
server {
    listen 80;
    server_name sukien.keemori.com;

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# API (NestJS)
server {
    listen 80;
    server_name api-sukien.keemori.com;

    # Ảnh tải lên đi qua backend khi STORAGE_DRIVER=local; ảnh editor đã thu
    # nhỏ ở trình duyệt nhưng vẫn cần vượt mặc định 1MB của nginx.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# CMS
server {
    listen 80;
    server_name cms-sukien.keemori.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3112;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
